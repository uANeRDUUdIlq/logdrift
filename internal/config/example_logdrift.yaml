# logdrift example configuration

# How often to poll log files for new lines (e.g. 500ms, 1s)
poll_interval: 500ms

# Render JSON logs in a human-friendly format
pretty: true

# Emit raw log lines without any formatting
raw_output: false

# Optional CEL/simple filter expression applied to every log entry
# filter: 'level == "error"'

# Keyword highlighting rules (applied after formatting)
highlight:
  - word: ERROR
    color: red
  - word: WARN
    color: yellow
  - word: timeout
    color: magenta

# Log sources to tail
services:
  - name: api
    path: /var/log/myapp/api.log
  - name: worker
    path: /var/log/myapp/worker.log
